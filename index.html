<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Almoxarifado"/>
<meta name="theme-color" content="#12141a"/>
<title>Almoxarifado · Pedroni</title>
<style>
:root{--bg:#12141a;--surf:#1a1d24;--surf2:#22262f;--surf3:#2a2f39;--line:#2e333d;--txt:#eceef1;--txt2:#9aa0aa;--txt3:#666d78;--rebar:#d97642;--rebar2:#e8915f;--rebar-dim:rgba(217,118,66,.12);--ok:#3fb873;--bad:#d9534f;--warn:#e0a52e;--blue:#5b9bd5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:84px;font-size:15px;min-height:100vh}
/* cabeçalho (padrão Gestão / Motor) */
.app-header{position:sticky;top:0;z-index:40;background:rgba(18,20,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.ah-mark{width:34px;height:34px;background:var(--rebar);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;cursor:pointer}
.ah-title{flex:1;min-width:0}
.ah-title .t{font-size:1rem;font-weight:750;line-height:1.15;display:flex;align-items:center;gap:8px}
.ah-title .s{font-size:.72rem;color:var(--txt2);display:flex;align-items:center;gap:6px;margin-top:2px}
.ver{background:var(--rebar);color:#fff;font-size:.7rem;font-weight:800;border-radius:10px;padding:1px 8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--txt3);flex-shrink:0}
.sync-dot.ok{background:var(--ok)}.sync-dot.off{background:var(--bad)}
.ah-avatar{width:34px;height:34px;border-radius:50%;background:var(--surf3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:var(--rebar2);cursor:pointer;flex-shrink:0}
/* menu inferior */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;border:none;color:var(--txt2);padding:9px 2px 10px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav.bottom button b{font-size:20px;font-weight:400;line-height:1.1}
nav.bottom button.active{color:var(--rebar)}
#main{padding:14px 14px 20px;max-width:900px;margin:0 auto}
/* formulários */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column}
.form-group label{display:block;font-size:12px;color:var(--txt2);margin:10px 0 4px}
input,select,textarea{background:var(--surf2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rebar)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
textarea{resize:vertical;min-height:64px}
input[type=date]{color-scheme:dark}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--rebar);color:#fff;border:none;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-primary,.btn-purple{background:var(--rebar);color:#fff}
.btn-primary{width:100%}
.btn-secondary{background:var(--surf3);color:var(--txt);border:1px solid var(--line)}
.btn-danger,.btn-red{background:var(--bad);color:#fff}
.btn-green{background:var(--ok);color:#fff}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn-full{width:100%}
.btn:active{opacity:.85}
/* filtros */
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--surf2);border:1px solid var(--line);color:var(--txt2);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.active{background:var(--rebar);border-color:var(--rebar);color:#fff;font-weight:600}
/* tags */
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.02em}
.badge-green{background:rgba(63,184,115,.18);color:var(--ok)}
.badge-yellow{background:rgba(224,165,46,.18);color:var(--warn)}
.badge-orange{background:var(--rebar-dim);color:var(--rebar2)}
.badge-red{background:rgba(217,83,79,.18);color:var(--bad)}
.badge-blue{background:rgba(91,155,213,.18);color:var(--blue)}
.badge-purple{background:var(--surf3);color:var(--txt2)}
.badge-gray{background:var(--surf3);color:var(--txt2)}
/* cartões de item */
.item-card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.item-foto{width:58px;height:58px;border-radius:10px;flex-shrink:0;background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.item-foto img{width:58px;height:58px;object-fit:cover}
.item-info{flex:1;min-width:0}
.item-nome{font-size:14px;font-weight:600;margin-bottom:3px}
.item-meta{font-size:12px;color:var(--txt2);margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item-qtd{font-size:24px;font-weight:800;line-height:1;text-align:right}
.item-qtd-label{font-size:11px;color:var(--txt2);text-align:right}
.item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* histórico */
.mov-card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.mov-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.mov-nome{font-size:14px;font-weight:600}
.mov-qtd-saida{font-size:18px;font-weight:800;color:var(--bad);white-space:nowrap}
.mov-qtd-entrada{font-size:18px;font-weight:800;color:var(--ok);white-space:nowrap}
.mov-meta{font-size:12px;color:var(--txt2);display:flex;flex-wrap:wrap;gap:8px}
.mov-date{font-size:11px;color:var(--txt3)}
/* alerta de críticos */
.alert-critico{background:var(--surf);border:1px solid rgba(217,118,66,.35);border-radius:12px;margin-bottom:12px;overflow:hidden}
.alert-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;background:var(--rebar-dim)}
.alert-header-left{display:flex;align-items:center;gap:8px}
.alert-header-title{font-size:13.5px;font-weight:700;color:var(--rebar2)}
.alert-header-count{background:var(--rebar);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 8px}
.alert-toggle{font-size:12px;color:var(--txt2);transition:transform .2s}
.alert-toggle.open{transform:rotate(180deg)}
.alert-body{border-top:1px solid var(--line)}
.alert-com-pedido,.alert-sem-max{background:transparent}
.alert-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);gap:8px}
.alert-row:last-child{border-bottom:none}
.alert-nome{font-size:13px;color:var(--txt);flex:1;min-width:0}
.alert-pedido{font-size:12.5px;font-weight:700;color:var(--blue);white-space:nowrap}
.alert-semmax{font-size:11.5px;color:var(--txt3);white-space:nowrap}
.alert-section-label{font-size:11.5px;color:var(--rebar);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:10px 14px 4px}
/* resumo do topo */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px}
.stat-card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat-num{font-size:20px;font-weight:800;line-height:1.1;color:var(--txt)}
.stat-label{display:block;color:var(--txt2);font-size:11px;margin-top:2px}
.stat-card.danger .stat-num{color:var(--bad)}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-input{flex:1}
.section-label{font-size:11.5px;color:var(--rebar);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:14px 0 6px}
.resp-card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
/* modal */
#modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 10px 40px}
#modal-box{background:var(--surf);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px}
#modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
#modal-header h2{font-size:17px;font-weight:700}
#modal-close{background:none;border:none;color:var(--txt);font-size:20px;cursor:pointer;padding:2px 6px}
#modal-body{padding:0 16px 16px}
.item-preview-modal{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;margin-bottom:6px}
.foto-upload-btn{width:100%;height:110px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--txt3);cursor:pointer;background:var(--surf2)}
.foto-upload-btn:active{border-color:var(--rebar);color:var(--rebar2)}
.foto-preview-wrap{position:relative;width:100%;height:140px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.foto-preview-wrap img{width:100%;height:100%;object-fit:cover}
.foto-remove{position:absolute;top:8px;right:8px;background:var(--bad);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:15px}
#loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
#loading-box{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:22px 34px;display:flex;flex-direction:column;align-items:center;gap:10px}
#loading-box p{font-size:14px;font-weight:600}
.empty{color:var(--txt2);text-align:center;padding:22px 10px;font-size:14px}
.empty .empty-icon{font-size:34px;margin-bottom:8px}
.empty small{font-size:12px;color:var(--txt3);display:block;margin-top:4px}
.rel-equip-card{background:var(--surf2);border:1px solid var(--line);border-left:4px solid var(--rebar);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rel-equip-num{font-size:22px;font-weight:800;color:var(--rebar2);line-height:1}
/* histórico de compras */
.compras-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.compras-table th{color:var(--txt2);font-weight:600;font-size:11.5px;text-transform:uppercase;padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.compras-table td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.add-compra-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:10px;background:var(--surf2);padding:10px;border-radius:10px;border:1px solid var(--line)}
.add-compra-row .form-group label{margin-top:0}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:1}
  .add-compra-row{grid-template-columns:1fr 1fr}
  .add-compra-row .btn{grid-column:1/-1}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="ah-mark" onclick="setTab('estoque')">📦</div>
  <div class="ah-title"><div class="t">Almoxarifado Pedroni <span class="ver" id="ver"></span></div><div class="s"><span class="sync-dot" id="sync-dot"></span><span id="sync">conectando…</span></div></div>
  <div class="ah-avatar" onclick="setTab('equipe')" title="Equipe e categorias">PE</div>
</header>
<nav class="bottom">
  <button class="tab-btn active" onclick="setTab('estoque')" id="tab-estoque"><b>📦</b>Estoque</button>
  <button class="tab-btn" onclick="setTab('historico')" id="tab-historico"><b>📋</b>Histórico</button>
  <button class="tab-btn" onclick="setTab('equipe')" id="tab-equipe"><b>👥</b>Equipe</button>
</nav>

<div id="main"></div>

<div id="modal-overlay" style="display:none" onclick="if(event.target===this)fecharModal()">
  <div id="modal-box">
    <div id="modal-header">
      <h2 id="modal-title"></h2>
      <button id="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="loading-overlay" style="display:none">
  <div id="loading-box"><span style="font-size:32px">⏳</span><p>Salvando...</p></div>
</div>

<script type="module">
import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
         onSnapshot, query, orderBy, serverTimestamp }
                                from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
                                from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2aTKzjA3hzlAg90sQ6WAZdGkRziLrvkE",
  authDomain: "almoxarifado-pedroni.firebaseapp.com",
  databaseURL: "https://almoxarifado-pedroni-default-rtdb.firebaseio.com",
  projectId: "almoxarifado-pedroni",
  storageBucket: "almoxarifado-pedroni.firebasestorage.app",
  messagingSenderId: "320508679156",
  appId: "1:320508679156:web:c2a85b8d6f8912715a5fa1"
};
const fbApp   = initializeApp(firebaseConfig);
const db      = getFirestore(fbApp);
const storage = getStorage(fbApp);

// ── Constantes ────────────────────────────────────────────────────────────────
const SETORES = [
  "Blocos maquina PWR","Blocos maquina Gervasi","Tubos maquina LKR",
  "Tubos vibrados","Tubos Maquina Tuber","Fossas","Caixas",
  "Tampas/Leitos","Central dosadora 01","Central dosadora 02 (nova)","Pessoa/Geral"
];
const CATEGORIAS_PADRAO = ["EPI","Ferramenta","Consumível","Peça de Reposição","Elétrico","Hidráulico","Outros"];
const UNIDADES = ["un","par","cx","kg","m","L","m²","rolo"];
const getCategorias = () => [...new Set([...CATEGORIAS_PADRAO, ...categorias.map(c=>c.nome)])];

// ── Estado ────────────────────────────────────────────────────────────────────
let itens=[], movimentacoes=[], responsaveis=[], categorias=[];
let tabAtual="estoque", busca="", filtroCategoria="Todos", fotoTemp=null;
let comprasEmEdicao=[];  // compras do item que está sendo editado no modal

// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
window.$ = $;
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const mes = () => new Date().toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).replace(/^\w/,c=>c.toUpperCase());
const fmtDate = ts => {
  if(!ts)return"—";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
};
const fmtDateShort = ts => {
  if(!ts)return"—";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
};
const fmtBRL = v => {
  const n=Number(v);
  return isNaN(n)?"—":"R$ "+n.toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
};
const statusItem = item => {
  const q=Number(item.quantidade),m=Number(item.qtdMinima),x=Number(item.qtdMaxima||0);
  if(q===0)       return{label:"Zerado",   cls:"badge-red",    cor:"var(--bad)"};
  if(q<=m)        return{label:"Crítico",  cls:"badge-orange",  cor:"var(--rebar2)"};
  if(q<=m*1.5)    return{label:"Baixo",    cls:"badge-yellow",  cor:"var(--warn)"};
  if(x>0&&q>=x)   return{label:"No máximo",cls:"badge-blue",    cor:"var(--blue)"};
  return               {label:"OK",       cls:"badge-green",   cor:"var(--txt)"};
};
// Quanto falta para atingir o máximo (para sugerir pedido)
const sugerirPedido = item => {
  const q=Number(item.quantidade), m=Number(item.qtdMinima||0), x=Number(item.qtdMaxima||0);
  if(x<=0) return null;       // sem máximo definido: não sugere
  if(q > m) return null;      // estoque acima do mínimo: não sugere
  const falta = x - q;
  return falta > 0 ? falta : 0;
};
const precoVigente = item => {
  if(!item.compras||!item.compras.length)return null;
  const sorted=[...item.compras].sort((a,b)=>new Date(b.data)-new Date(a.data));
  return sorted[0].preco;
};
async function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=800;let{width:w,height:h}=img;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>resolve(b),"image/jpeg",.75);URL.revokeObjectURL(url);
    };img.src=url;
  });
}

// ── Firebase listeners ────────────────────────────────────────────────────────
onSnapshot(collection(db,"itens"),snap=>{
  itens=snap.docs.map(d=>({id:d.id,...d.data()}));setSync(navigator.onLine?"ok":"off");renderTab();
},err=>{console.error(err);setSync("off");});
onSnapshot(query(collection(db,"movimentacoes"),orderBy("criadoEm","desc")),snap=>{
  movimentacoes=snap.docs.map(d=>({id:d.id,...d.data()}));renderTab();
});
onSnapshot(collection(db,"responsaveis"),snap=>{
  responsaveis=snap.docs.map(d=>({id:d.id,...d.data()}));renderTab();
});
onSnapshot(query(collection(db,"categorias"),orderBy("nome")),snap=>{
  categorias=snap.docs.map(d=>({id:d.id,...d.data()}));renderTab();
});

const VERSAO="v7";
$("ver").textContent=VERSAO;
function setSync(st){ $("sync-dot").className="sync-dot "+st; $("sync").textContent=st==="ok"?"Sincronizado na nuvem":st==="off"?"Sem conexão":"conectando…"; }
window.addEventListener("offline",()=>setSync("off"));
window.addEventListener("online",()=>setSync("ok"));

// ── Tab ───────────────────────────────────────────────────────────────────────
window.setTab=t=>{
  tabAtual=t;busca="";filtroCategoria="Todos";
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  $("tab-"+t).classList.add("active");
  renderTab();
};
function renderTab(){
  if(tabAtual==="estoque")        renderEstoque();
  else if(tabAtual==="historico") renderHistorico();
  else if(tabAtual==="equipe")    renderEquipe();
}

// ── RENDER ESTOQUE ────────────────────────────────────────────────────────────
function renderListaItens(){
  const criticos=itens.filter(i=>Number(i.quantidade)<=Number(i.qtdMinima));
  const filtrados=itens.filter(i=>{
    const mb=(i.nome||"").toLowerCase().includes(busca.toLowerCase())||(i.codigo||"").toLowerCase().includes(busca.toLowerCase())||(i.localizacao||"").toLowerCase().includes(busca.toLowerCase());
    const mc=filtroCategoria==="Todos"||i.categoria===filtroCategoria;
    return mb&&mc;
  }).sort((a,b)=>{
    const la=(a.localizacao||"").toLowerCase();
    const lb=(b.localizacao||"").toLowerCase();
    if(la&&!lb) return -1; // com localização vem antes
    if(!la&&lb) return 1;
    if(la!==lb) return la.localeCompare(lb,"pt-BR",{numeric:true,sensitivity:"base"});
    return (a.nome||"").localeCompare(b.nome||"","pt-BR"); // desempate por nome
  });

  // Stats
  const statsEl=$("est-stats");
  if(statsEl) statsEl.innerHTML=`
    <div class="stat-card"><div class="stat-num">${itens.length}</div><div class="stat-label">Itens cadastrados</div></div>
    ${criticos.length?`<div class="stat-card danger"><div class="stat-num">${criticos.length}</div><div class="stat-label">Crítico${criticos.length>1?"s":""}</div></div>`:""}
    <div class="stat-card"><div class="stat-num">${movimentacoes.filter(m=>m.tipo==="saida").length}</div><div class="stat-label">Total saídas</div></div>`;

  // Alerta críticos — colapsável com dois grupos
  const alertEl=$("est-alerta");
  if(alertEl){
    if(!criticos.length){alertEl.innerHTML="";} else {
      const comPedido=criticos.filter(i=>sugerirPedido(i)>0);
      const semMax=criticos.filter(i=>!Number(i.qtdMaxima||0)); // só os que realmente não têm máximo
      alertEl.innerHTML=`<div class="alert-critico">
        <div class="alert-header" onclick="toggleAlerta()">

            <span style="font-size:16px;">⚠️</span>

          ${comPedido.length?`<div class="alert-com-pedido">

            ${comPedido.map(i=>{const s=sugerirPedido(i);return`

          </div>`:""}
        </div>

  // Pills categorias
  const pillsEl=$("est-pills");

  // Lista de itens — só esta parte muda durante a busca
  const listaEl=$("est-lista");
  if(!listaEl) return;
  listaEl.innerHTML=filtrados.length===0
    ?`<div class="empty"><div class="empty-icon">📦</div><p>Nenhum item encontrado</p><small>Clique em "+ Novo Item" para cadastrar</small></div>`

                ${item.localizacao?`<span>📍 ${esc(item.localizacao)}</span>`:""}
                ${preco!==null?`<span style="color:var(--ok);font-weight:700;">💰 ${fmtBRL(preco)}</span>`:""}

              ${(()=>{const s=sugerirPedido(item);return s>0?`<div class="item-qtd-label" style="color:var(--blue);font-weight:700;">🛒 pedir ${s}</div>`:""})()}

// Gerencia compras em edição
window.addCompraItem=()=>{
  const data=$("c-data")?.value;
  const preco=parseFloat($("c-preco")?.value);
  const forn=$("c-forn")?.value?.trim()||"";
  if(!data||isNaN(preco)||preco<=0){alert("Informe data e preço válidos.");return;}
  comprasEmEdicao.push({data,preco,fornecedor:forn});
  // Re-render apenas a tabela
  const lista=$("compras-lista");
  if(lista){
    const sorted=[...comprasEmEdicao].sort((a,b)=>new Date(b.data)-new Date(a.data));
    lista.innerHTML=`<table class="compras-table">
      <thead><tr><th>Data</th><th>Preço Unit.</th><th>Fornecedor</th><th></th></tr></thead>
      <tbody>
        ${sorted.map(c=>`<tr>
          <td>${c.data||"—"}</td>
          <td style="font-weight:700;color:var(--ok);">${fmtBRL(c.preco)}</td>
          <td style="color:var(--txt2);">${esc(c.fornecedor||"—")}</td>
          <td><button onclick="removerCompra(${comprasEmEdicao.indexOf(c)})" style="background:rgba(217,83,79,.18);color:var(--bad);border:none;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">✕</button></td>
        </tr>`).join("")}
      </tbody></table>`;
  }
  if($("c-preco"))$("c-preco").value="";
  if($("c-forn"))$("c-forn").value="";
};

window.removerCompra=idx=>{
  comprasEmEdicao.splice(idx,1);
  const lista=$("compras-lista");
  if(!lista)return;
  if(comprasEmEdicao.length===0){lista.innerHTML=`<div style="color:var(--txt3);font-size:13px;padding:8px 0;">Nenhuma compra cadastrada ainda.</div>`;return;}
  const sorted=[...comprasEmEdicao].sort((a,b)=>new Date(b.data)-new Date(a.data));
  lista.innerHTML=`<table class="compras-table">
    <thead><tr><th>Data</th><th>Preço Unit.</th><th>Fornecedor</th><th></th></tr></thead>
    <tbody>
      ${sorted.map(c=>`<tr>
        <td>${c.data||"—"}</td>
        <td style="font-weight:700;color:var(--ok);">${fmtBRL(c.preco)}</td>
        <td style="color:var(--txt2);">${esc(c.fornecedor||"—")}</td>
        <td><button onclick="removerCompra(${comprasEmEdicao.indexOf(c)})" style="background:rgba(217,83,79,.18);color:var(--bad);border:none;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">✕</button></td>
      </tr>`).join("")}
    </tbody></table>`;
};

// Foto
window.handleFoto=async input=>{
  const file=input.files[0];if(!file)return;
  $("foto-wrap").innerHTML=`<div class="foto-upload-btn" style="cursor:default;border-color:var(--rebar2);color:var(--rebar2);"><span style="font-size:24px;">⏳</span><span style="font-size:13px;">Enviando...</span></div>`;
  try{
    const blob=await compressImage(file);
    const path=`itens/${Date.now()}_${file.name}`;
    await uploadBytes(ref(storage,path),blob);
    const url=await getDownloadURL(ref(storage,path));
    fotoTemp={url,path};
    $("foto-wrap").innerHTML=`<div class="foto-preview-wrap"><img src="${url}"/><button class="foto-remove" onclick="removerFoto()">×</button></div>`;
  }catch(e){
    alert("Erro ao enviar foto: "+e.message);
    $("foto-wrap").innerHTML=`<div class="foto-upload-btn" onclick="document.getElementById('inp-foto').click()"><span style="font-size:28px;">📷</span><span style="font-size:13px;font-weight:500;">Tirar foto ou escolher arquivo</span></div>`;
  }
};
window.removerFoto=async()=>{
  if(fotoTemp?.path)try{await deleteObject(ref(storage,fotoTemp.path));}catch{}
  fotoTemp=null;
  $("foto-wrap").innerHTML=`<div class="foto-upload-btn" onclick="document.getElementById('inp-foto').click()"><span style="font-size:28px;">📷</span><span style="font-size:13px;font-weight:500;">Tirar foto ou escolher arquivo</span></div>`;
};

window.submitItem=async(id,existURL,existPath)=>{
  const nome=$("f-nome")?.value?.trim();
  if(!nome){alert("Informe o nome do item");return;}
  setSalvando(true);
  const data={
    nome, codigo:$("f-codigo").value.trim(),
    categoria:$("f-categoria").value,
    localizacao:$("f-local").value.trim(),
    quantidade:id?Number(itens.find(i=>i.id===id)?.quantidade||0):Number($("f-qtd")?.value||0),
    qtdMinima:Number($("f-qtdmin").value),
    qtdMaxima:Number($("f-qtdmax").value)||0,
    unidade:$("f-unidade").value,
    observacoes:$("f-obs").value.trim(),
    fotoURL:fotoTemp?.url||existURL||"",
    fotoPath:fotoTemp?.path||existPath||"",
    compras:comprasEmEdicao
  };
  try{
    if(id)await updateDoc(doc(db,"itens",id),data);
    else  await addDoc(collection(db,"itens"),{...data,criadoEm:serverTimestamp()});
    fotoTemp=null;comprasEmEdicao=[];fecharModal();
  }catch(e){alert("Erro: "+e.message);}
  setSalvando(false);
};

window.deletarItem=async id=>{
  const item=itens.find(i=>i.id===id);
  if(!item||!confirm(`Excluir "${item.nome}"?`))return;
  if(item.fotoPath)try{await deleteObject(ref(storage,item.fotoPath));}catch{}
  await deleteDoc(doc(db,"itens",id));
};
window.setCategoria=c=>{filtroCategoria=c;renderEstoque();};

// Mostrar/esconder campos conforme tipo de movimentação
window.toggleCamposMov=tipo=>{
  const wrapColab=$("m-wrap-colab");
  const wrapSetor=$("m-wrap-setor");
  const wrapCompra=$("m-wrap-compra");
  const wrapMotivo=$("m-wrap-motivo");
  const wrapMotivoObs=$("m-wrap-motivo-obs");
  if(wrapColab)     wrapColab.style.display=tipo==="saida"?"":"none";
  if(wrapSetor)     wrapSetor.style.display=tipo==="saida"?"":"none";
  if(wrapCompra)    wrapCompra.style.display=tipo==="entrada"?"":"none";
  if(wrapMotivo)    wrapMotivo.style.display=tipo==="ajuste"?"":"none";
  if(wrapMotivoObs) wrapMotivoObs.style.display=tipo==="ajuste"?"":"none";
};

// Excluir movimentação e reverter estoque
window.excluirMovimentacao=async(movId,itemId,qtd,tipo,estoqueDepois)=>{
  if(!confirm("Excluir esta movimentação? O estoque será revertido automaticamente."))return;
  setSalvando(true);
  try{
    const item=itens.find(i=>i.id===itemId);
    if(item){
      // Reverter: se era saída, devolve; se era entrada, retira
      let qtdRevertida=Number(item.quantidade);
      if(tipo==="saida")      qtdRevertida+=Number(qtd);
      else if(tipo==="entrada")qtdRevertida-=Number(qtd);
      // Para ajuste, tenta restaurar o estoqueAntes se disponível
      const mov=movimentacoes.find(m=>m.id===movId);
      if(tipo==="ajuste"&&mov&&mov.estoqueAntes!==undefined) qtdRevertida=Number(mov.estoqueAntes);
      if(qtdRevertida<0)qtdRevertida=0;
      await updateDoc(doc(db,"itens",itemId),{quantidade:qtdRevertida});
    }
    await deleteDoc(doc(db,"movimentacoes",movId));
  }catch(e){alert("Erro ao excluir: "+e.message);}
  setSalvando(false);
};
window.toggleAlerta=()=>{
  const body=$("alert-body");
  const icon=$("alert-toggle-icon");
  if(!body||!icon)return;
  const open=body.style.display==="none";
  body.style.display=open?"block":"none";
  icon.classList.toggle("open",open);
};

window.submitMov=async itemId=>{
  const tipo=$("m-tipo")?.value;
  const resp=$("m-resp")?.value;
  const colab=$("m-colab")?.value?.trim();
  const setor=$("m-setor")?.value;
  const motivo=$("m-motivo")?.value||"";
  const motivoObs=$("m-motivo-obs")?.value?.trim()||"";
  if(!resp){alert("Selecione o responsável");return;}
  if(tipo==="saida"&&!colab){alert("Informe o colaborador");return;}
  if(tipo==="saida"&&!setor){alert("Selecione o setor / destino");return;}
  if(tipo==="ajuste"&&!motivo){alert("Selecione o motivo do ajuste");return;}
  setSalvando(true);
  const item=itens.find(i=>i.id===itemId);
  const qtd=Number($("m-qtd").value);
  let novaQtd=Number(item.quantidade);
  if(tipo==="saida")novaQtd-=qtd;
  else if(tipo==="entrada")novaQtd+=qtd;
  else novaQtd=qtd;
  if(novaQtd<0){setSalvando(false);alert("Quantidade insuficiente em estoque!");return;}
  const maxItem=Number(item.qtdMaxima||0);
  if(tipo==="entrada"&&maxItem>0&&novaQtd>maxItem){
    if(!confirm(`⚠️ Esta entrada vai levar o estoque para ${novaQtd} ${item.unidade||"un"}, acima do máximo definido (${maxItem}).

Deseja continuar mesmo assim?`)){setSalvando(false);return;}
  }
  // Se entrada com dados de compra, salva no histórico do item
  let precoUnitario=precoVigente(item);
  if(tipo==="entrada"){
    const cData=$("m-c-data")?.value;
    const cPreco=parseFloat($("m-c-preco")?.value||"");
    const cForn=$("m-c-forn")?.value?.trim()||"";
    if(cData&&!isNaN(cPreco)&&cPreco>0){
      const novasCompras=[...(item.compras||[]),{data:cData,preco:cPreco,fornecedor:cForn}];
      await updateDoc(doc(db,"itens",itemId),{compras:novasCompras});
      precoUnitario=cPreco;
    }
  }
  try{
    await updateDoc(doc(db,"itens",itemId),{quantidade:novaQtd});
    await addDoc(collection(db,"movimentacoes"),{
      tipo,quantidade:qtd,responsavel:resp,colaborador:colab,
      setor,
      motivo:tipo==="ajuste"?(motivo+(motivoObs?" — "+motivoObs:"")):"",
      observacao:$("m-obs")?.value?.trim()||"",
      itemId,itemNome:item.nome,itemCodigo:item.codigo||"",itemUnidade:item.unidade||"un",
      precoUnitario,
      valorTotal:precoUnitario!==null?precoUnitario*qtd:null,
      estoqueAntes:Number(item.quantidade),estoqueDepois:novaQtd,
      criadoEm:serverTimestamp()
    });
    fecharModal();
  }catch(e){alert("Erro: "+e.message);}
  setSalvando(false);
};

// ── MODAL RELATÓRIO ───────────────────────────────────────────────────────────
window.abrirModalRelatorio=()=>{
  const saidas=movimentacoes.filter(m=>m.tipo==="saida"&&m.setor);
  const setoresUsados=["Todos",...new Set(saidas.map(m=>m.setor))].sort();
  const agrupado=saidas.reduce((acc,m)=>{if(!acc[m.setor])acc[m.setor]=[];acc[m.setor].push(m);return acc;},{});
  const resumo=Object.entries(agrupado).map(([s,movs])=>({
    setor:s, total:movs.length,
    itensDif:new Set(movs.map(m=>m.itemId)).size,
    valorTotal:movs.reduce((sum,m)=>sum+(m.valorTotal||0),0),
    colaboradores:[...new Set(movs.map(m=>m.colaborador).filter(Boolean))],
    ultima:movs[0]?.criadoEm
  })).sort((a,b)=>b.total-a.total);

  abrirModal("📊 Relatório de Saídas por Setor",`
    <div class="form-grid">
      <div class="full form-group">
        <label>Setor</label>
        <select id="rel-setor">${setoresUsados.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
      </div>
      <div class="form-group"><label>Data Início</label><input id="rel-inicio" type="date"/></div>
      <div class="form-group"><label>Data Fim</label><input id="rel-fim" type="date"/></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-red" style="flex:1" onclick="gerarPDF()">📄 PDF</button>
      <button class="btn btn-green" style="flex:1" onclick="gerarCSV()">📊 CSV</button>
    </div>
    ${resumo.length?`
      <div style="margin-top:20px;">
        <div class="section-label">Resumo geral por setor</div>
        ${resumo.map(r=>`<div class="rel-equip-card">
          <div>
            <div style="font-size:14px;font-weight:700;">⚙️ ${esc(r.setor)}</div>
            <div style="font-size:12px;color:var(--txt2);margin-top:2px;">${r.itensDif} tipo(s) · última ${fmtDateShort(r.ultima)}</div>
            ${r.colaboradores.length?`<div style="font-size:12px;color:var(--txt3);">👤 ${r.colaboradores.map(esc).join(", ")}</div>`:""}
            ${r.valorTotal>0?`<div style="font-size:12px;font-weight:700;color:var(--ok);margin-top:2px;">Total: ${fmtBRL(r.valorTotal)}</div>`:""}
          </div>
          <div style="text-align:right;">
            <div class="rel-equip-num">${r.total}</div>
            <div style="font-size:11px;color:var(--txt2);">saídas</div>
          </div>
        </div>`).join("")}
      </div>`:""}
    <button class="btn btn-secondary btn-full" style="margin-top:16px;" onclick="fecharModal()">Fechar</button>
  `);
};

function getFiltradas(){
  const s=$("rel-setor")?.value||"Todos";
  const di=$("rel-inicio")?.value||"";
  const df=$("rel-fim")?.value||"";
  return movimentacoes.filter(m=>m.tipo==="saida").filter(m=>{
    if(s!=="Todos"&&m.setor!==s)return false;
    if(di||df){
      const d=m.criadoEm?.toDate?m.criadoEm.toDate():new Date(m.criadoEm);
      if(di&&d<new Date(di))return false;
      if(df&&d>new Date(df+"T23:59:59"))return false;
    }
    return true;
  });
}

window.gerarCSV=()=>{
  const filtradas=getFiltradas();
  if(!filtradas.length){alert("Nenhum dado para exportar.");return;}
  const rows=[
    ["Data/Hora","Setor","Item","Código","Qtd","Unid","Preço Unit.","Valor Total","Colaborador","Responsável","Est.Antes","Est.Depois","Obs"],
    ...filtradas.map(m=>[
      fmtDate(m.criadoEm),m.setor||"",m.itemNome,m.itemCodigo||"",
      m.quantidade,m.itemUnidade||"",
      m.precoUnitario!=null?m.precoUnitario:"",
      m.valorTotal!=null?m.valorTotal:"",
      m.colaborador||"",m.responsavel||"",
      m.estoqueAntes??"",m.estoqueDepois??"",m.observacao||""
    ])
  ];
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
  a.download=`saidas_${new Date().toISOString().slice(0,10)}.csv`;a.click();
};

window.gerarPDF=async()=>{
  const filtradas=getFiltradas();
  if(!filtradas.length){alert("Nenhum dado para exportar.");return;}
  const setor=$("rel-setor")?.value||"Todos";
  const di=$("rel-inicio")?.value||"";
  const df=$("rel-fim")?.value||"";
  await new Promise(res=>{if(window.jspdf){res();return;}const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=res;document.head.appendChild(s);});
  await new Promise(res=>{if(window.jspdfAutoTable){res();return;}const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js";s.onload=res;document.head.appendChild(s);});
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  const W=pdf.internal.pageSize.getWidth();
  const now=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const addHeader=titulo=>{
    pdf.setFillColor(91,33,182);pdf.rect(0,0,W,18,"F");
    pdf.setTextColor(255,255,255);pdf.setFontSize(13);pdf.setFont("helvetica","bold");
    pdf.text("ALMOXARIFADO · PEDRONI",14,7);
    pdf.setFontSize(9);pdf.setFont("helvetica","normal");
    pdf.text(titulo,14,13);pdf.text(`Gerado: ${now}`,W-14,13,{align:"right"});
    pdf.setTextColor(30,30,30);
  };
  addHeader("Relatório de Saídas por Setor");
  const periodo=di||df?`${di?new Date(di).toLocaleDateString("pt-BR"):"início"} até ${df?new Date(df).toLocaleDateString("pt-BR"):"hoje"}`:"Todo o período";
  pdf.setFontSize(9);pdf.setTextColor(80,80,80);
  pdf.text(`Setor: ${setor}   |   Período: ${periodo}   |   Registros: ${filtradas.length}`,14,26);

  const agrupado=filtradas.reduce((acc,m)=>{const k=m.setor||"Sem setor";if(!acc[k])acc[k]=[];acc[k].push(m);return acc;},{});
  const resumo=Object.entries(agrupado).map(([s,movs])=>({
    setor:s,total:movs.length,itensDif:new Set(movs.map(m=>m.itemId)).size,
    valorTotal:movs.reduce((sum,m)=>sum+(m.valorTotal||0),0),
    colaboradores:[...new Set(movs.map(m=>m.colaborador).filter(Boolean))],
    ultima:movs[0]?.criadoEm
  })).sort((a,b)=>b.total-a.total);

  if(resumo.length){
    pdf.setFontSize(10);pdf.setFont("helvetica","bold");pdf.setTextColor(91,33,182);
    pdf.text("RESUMO POR SETOR",14,34);pdf.setTextColor(30,30,30);
    pdf.autoTable({startY:37,
      head:[["Setor","Nº Saídas","Itens Diferentes","Valor Total","Colaboradores","Última Saída"]],
      body:resumo.map(r=>[r.setor,r.total,r.itensDif,r.valorTotal>0?fmtBRL(r.valorTotal):"—",r.colaboradores.join(", ")||"—",fmtDateShort(r.ultima)]),
      styles:{fontSize:8,cellPadding:3},
      headStyles:{fillColor:[91,33,182],textColor:255,fontStyle:"bold"},
      alternateRowStyles:{fillColor:[245,243,255]},
      margin:{left:14,right:14}});
  }

  Object.entries(agrupado).forEach(([setor2,movs])=>{
    pdf.addPage();addHeader(`Detalhamento · ${setor2}`);
    pdf.setFontSize(10);pdf.setFont("helvetica","bold");pdf.setTextColor(91,33,182);
    pdf.text(`SETOR: ${setor2.toUpperCase()}`,14,26);
    pdf.setFontSize(8);pdf.setFont("helvetica","normal");pdf.setTextColor(80,80,80);
    const vt=movs.reduce((s,m)=>s+(m.valorTotal||0),0);
    pdf.text(`${movs.length} saída(s)${vt>0?" · Total: "+fmtBRL(vt):""}`,14,31);
    pdf.setTextColor(30,30,30);
    pdf.autoTable({startY:35,
      head:[["Data/Hora","Item","Cód.","Qtd.","Un.","Preço","Valor","Colaborador","Responsável","Obs."]],
      body:movs.map(m=>[
        fmtDate(m.criadoEm),m.itemNome,m.itemCodigo||"—",m.quantidade,m.itemUnidade||"un",
        m.precoUnitario!=null?fmtBRL(m.precoUnitario):"—",
        m.valorTotal!=null?fmtBRL(m.valorTotal):"—",
        m.colaborador||"—",m.responsavel||"—",m.observacao||"—"
      ]),
      styles:{fontSize:7,cellPadding:2,overflow:"linebreak"},
      headStyles:{fillColor:[30,30,30],textColor:255,fontStyle:"bold",fontSize:7},
      alternateRowStyles:{fillColor:[248,248,248]},
      columnStyles:{0:{cellWidth:26},3:{halign:"center",cellWidth:10},4:{halign:"center",cellWidth:10},5:{cellWidth:20},6:{cellWidth:20}},
      margin:{left:14,right:14},
      didDrawPage:()=>addHeader(`Detalhamento · ${setor2}`)});
  });

  const pages=pdf.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    pdf.setPage(i);pdf.setFontSize(7);pdf.setTextColor(160,160,160);
    pdf.text(`Página ${i} de ${pages}`,W/2,pdf.internal.pageSize.getHeight()-5,{align:"center"});
  }
  pdf.save(`relatorio_saidas_${new Date().toISOString().slice(0,10)}.pdf`);
};
